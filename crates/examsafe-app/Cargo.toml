[package]
name = "examsafe-app"
description = "ExamSafe desktop app: Slint UI + tray icon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "examsafe"
path = "src/main.rs"

[dependencies]
examsafe-core.workspace = true
examsafe-platform.workspace = true
examsafe-helper.workspace = true
slint.workspace = true
tray-icon.workspace = true

[dev-dependencies]
# Headless Slint backend for UI tests; must match the slint version exactly.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
