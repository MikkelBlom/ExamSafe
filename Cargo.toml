[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Mikkel Blom"]
publish = false

[workspace.dependencies]
examsafe-core = { path = "crates/examsafe-core" }
examsafe-platform = { path = "crates/examsafe-platform" }
examsafe-helper = { path = "crates/examsafe-helper" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Software renderer: lowest, flat RAM use (the GPU/Skia renderer has shown 200+ MB on Windows).
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
slint-build = "1.18"
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
